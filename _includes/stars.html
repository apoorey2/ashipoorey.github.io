<canvas id="star-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<script>
(function(){
  var c = document.getElementById('star-canvas');
  var ctx = c.getContext('2d');
  function draw() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    ctx.clearRect(0,0,c.width,c.height);
    var n = Math.floor(c.width * c.height / 2500);
    for (var i = 0; i < n; i++) {
      var x = Math.random()*c.width;
      var y = Math.random()*c.height;
      var r = Math.random()*1.1;
      var a = 0.3 + Math.random()*0.7;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle = Math.random()>0.85
        ? 'hsla(220,60%,92%,'+a+')'
        : 'hsla(0,0%,100%,'+a+')';
      ctx.fill();
    }
  }
  draw();
  window.addEventListener('resize', draw);
})();
</script>
